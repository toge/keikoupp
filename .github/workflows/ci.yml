name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git ~/vcpkg
          ~/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build
        run: |
          export VCPKG_ROOT=$HOME/vcpkg
          bash build.sh

      - name: Test
        run: |
          export VCPKG_ROOT=$HOME/vcpkg
          bash test.sh
